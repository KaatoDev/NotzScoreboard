name: NotzScoreboard
prefix: NotzScoreboard
version: '$version'

main: dev.kaato.notzscoreboard.NotzScoreboard
api-version: '26.2'
load: POSTWORLD

authors: [ KaaDev ]
description: A multi scoreboard plugin for staff, ranks and VIPs with multi-line system and animation support. Fully customizable.
website: https://kaato.dev
softdepend: [ PlaceholderAPI, ViaVersion ]

commands:
  nscoreboard:
    description: notzscoreboard admin command
    usage: /nsb
    aliases:
      - notzscoreboard
      - notzsb
      - nsb
permissions:
  notzscoreboard.admin:
    description: Admin perm
    default: op